openapi: 3.0.3
info:
  title: DSA Practice Platform API
  version: 0.0.1
servers:
  - url: http://localhost:3000
    description: Local dev
paths:
  /api/v1/health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
  /api/v1/problems:
    get:
      summary: List problems
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
